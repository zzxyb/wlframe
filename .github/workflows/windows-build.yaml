name: Build on Windows

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: debug
  WLF_VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_TRIPLET: x64-windows
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-binary-cache,readwrite

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install Meson and Ninja
      run: python -m pip install meson ninja

    - name: Setup MSVC toolchain
      uses: ilammy/msvc-dev-cmd@v1

    - name: Bootstrap vcpkg
      run: |
        if (!(Test-Path "$env:WLF_VCPKG_ROOT\.git")) {
          git clone https://github.com/microsoft/vcpkg.git "$env:WLF_VCPKG_ROOT"
        }
        & "$env:WLF_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

    - name: Capture vcpkg revision
      id: vcpkg_revision
      run: |
        $revision = (& git -C "$env:WLF_VCPKG_ROOT" rev-parse HEAD).Trim()
        "revision=$revision" >> $env:GITHUB_OUTPUT

    - name: Cache vcpkg binary packages
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        # The dependency list is kept in this workflow because vcpkg classic mode is used.
        key: ${{ runner.os }}-vcpkg-${{ env.VCPKG_TRIPLET }}-${{ steps.vcpkg_revision.outputs.revision }}-${{ hashFiles('.github/workflows/windows-build.yaml') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-${{ env.VCPKG_TRIPLET }}-${{ steps.vcpkg_revision.outputs.revision }}-
          ${{ runner.os }}-vcpkg-${{ env.VCPKG_TRIPLET }}-

    - name: Install dependencies
      run: |
        & "$env:WLF_VCPKG_ROOT\vcpkg.exe" install `
          libpng `
          libjpeg-turbo `
          libwebp `
          giflib `
          pixman `
          cairo `
          pango `
          harfbuzz `
          pkgconf `
          --triplet $env:VCPKG_TRIPLET

    - name: Export build environment
      run: |
        $installed = "$env:WLF_VCPKG_ROOT\installed\$env:VCPKG_TRIPLET"
        "PKG_CONFIG=$installed\tools\pkgconf\pkgconf.exe" >> $env:GITHUB_ENV
        "PKG_CONFIG_PATH=$installed\lib\pkgconfig;$installed\share\pkgconfig" >> $env:GITHUB_ENV
        "INCLUDE=$installed\include;$env:INCLUDE" >> $env:GITHUB_ENV
        "LIB=$installed\lib;$env:LIB" >> $env:GITHUB_ENV
        "$installed\tools\pkgconf" >> $env:GITHUB_PATH
        "$installed\bin" >> $env:GITHUB_PATH

    - name: Setup build
      run: |
        meson setup build-windows `
          --buildtype=$env:BUILD_TYPE `
          --fatal-meson-warnings `
          --wrap-mode=nofallback `
          --default-library=static

    - name: Build
      run: ninja -C build-windows -v

    - name: Run tests
      run: meson test -C build-windows --print-errorlogs
      continue-on-error: true
